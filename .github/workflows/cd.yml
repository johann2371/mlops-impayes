name: CD - Build et publication de l'image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/cd.yml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: 1 - Donnees (telechargement et validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas pyyaml huggingface_hub
      - name: Telecharger les donnees
        run: python -m src.data.ingest
      - name: Valider les donnees
        run: python -m src.data.validate
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/raw/telecom_credit_scoring_data.csv
          retention-days: 1

  train:
    name: 2 - Entrainement
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: data/raw
      - name: Entrainer le modele
        run: python -m src.models.train
      - uses: actions/upload-artifact@v4
        with:
          name: model-files
          path: |
            models/
            reports/metrics.json
          retention-days: 1

  validate-model:
    name: 3 - Validation du modele
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: model-files
          path: .
      - name: Valider le modele
        run: python -m src.models.validate_model

  image:
    name: 4 - Build et publication de l'image
    needs: validate-model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-files
          path: .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}