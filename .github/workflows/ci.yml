name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install flake8
      - run: flake8 --max-line-length 100 src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Télécharger les données
        run: python -m src.data.ingest

      - name: Entraîner un modèle rapide (10 % des données)
        run: python -m src.models.train --sample-frac 0.1

      - name: Construire l'image Docker
        run: docker build -t impayes-api .

      - name: Tester le conteneur
        run: |
          docker run -d --name api -p 8000:8000 impayes-api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"tenure_months": 24, "avg_monthly_spend_ngn": 5000.0, "recharge_frequency_per_month": 6, "payment_consistency_score": 0.8, "late_payment_count": 2, "operator": "MTN", "account_type": "prepaid"}' \
            | tee response.json
          grep -q '"prediction"' response.json

      - name: Logs du conteneur (en cas d'échec)
        if: failure()
        run: docker logs api