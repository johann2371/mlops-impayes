# Paramètres de l'entraînement (tâche 5). Un seul endroit pour les choix :
# toute modification ici change le run MLflow suivant.
seed: 42

data:
  # Nom du fichier suivi par DVC (data/raw/*.dvc). Surchargeable avec --data.
  raw_path: data/raw/telecom_credit_scoring_data.csv
  test_size: 0.2          # jeu de test, touché une seule fois (run final)
  validation_size: 0.2    # part du train réservée à la comparaison (ablation)
  sample_frac: null       # ex. 0.1 pour un essai rapide ; null = tout le jeu

features:
  feature_set: core       # core | with_scoring (voir docs/features.md)
  add_ratios: false

model:
  name: hist_gradient_boosting   # hist_gradient_boosting | logistic_regression
  class_weight: null             # null | balanced
  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.1
    max_depth: null
  logistic_regression:
    C: 1.0
    max_iter: 300

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: impayes-telecom
  artifact_location: null

outputs:
  model_path: models/model.joblib
  model_meta_path: models/model_meta.json
  metrics_path: reports/metrics.json
  confusion_matrix_path: reports/figures/confusion_matrix.png
  ablation_path: reports/ablation.csv
